name: Deploy Server to EC2

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify secrets are present
        run: |
          echo "Checking secrets..."
          echo "EC2_HOST: ${{ secrets.EC2_HOST != '' && 'Present' || 'Missing' }}"
          echo "EC2_USER: ${{ secrets.EC2_USER != '' && 'Present' || 'Missing' }}"
          echo "EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY != '' && 'Present' || 'Missing' }}"
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USER }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ One or more secrets are missing!"
            exit 1
          fi
          echo "✅ All secrets are present"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mediasoup-demo
            git pull origin main
            cd server
            yarn install
            yarn build
            pm2 restart mediasoup || pm2 start dist/index.js --name mediasoup
            pm2 save